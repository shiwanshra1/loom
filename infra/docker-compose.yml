services:
  # Host port 5433 (not 5432) — this machine already has an unrelated project's
  # Postgres container bound to 5432, and this compose file must not conflict
  # with it or assume it can be stopped.
  postgres:
    image: postgres:16
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: forgeloom
      POSTGRES_PASSWORD: forgeloom
      POSTGRES_DB: forgeloom_dev
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
      - "./postgres-init:/docker-entrypoint-initdb.d"
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: forgeloom
      MINIO_ROOT_PASSWORD: forgeloom123
    volumes: ["minio_data:/data"]

volumes:
  postgres_data:
  minio_data:
